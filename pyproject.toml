[project]
name = "pylings"
version = "0.1.0"
description = "Rustlings-style exercises for industry Python: DSA/NeetCode, TDD, FastAPI, SQS/SNS workers, AI backends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "boto3>=1.34",
    "moto>=5.0",
]

[project.scripts]
pylings = "pylings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pylings"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
